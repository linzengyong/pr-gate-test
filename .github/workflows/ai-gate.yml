name: AI Code Review Gate

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR 编号'
        required: true
      head_sha:
        description: 'PR head commit SHA'
        required: true
      verdict:
        description: 'success 或 failure'
        required: true
      summary:
        description: 'AI 审核结论'
        required: false
        default: ''

permissions:
  checks: write

jobs:
  create-check:
    runs-on: ubuntu-latest
    steps:
      - name: 创建 AI Code Review check-run
        uses: actions/github-script@v7
        with:
          script: |
            const i = context.payload.inputs;
            const conclusion = i.verdict === 'success' ? 'success' : 'failure';
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'AI Code Review',
              head_sha: i.head_sha,
              status: 'completed',
              conclusion: conclusion,
              output: {
                title: conclusion === 'success' ? '✅ AI 审核通过' : '❌ AI 审核未通过',
                summary: i.summary || '由 n8n AI 审核生成',
              },
            });
